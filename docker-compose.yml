# One coordinator (API gateway) + five dedicated node services.
# All services share a single ./data bind-mount so shares written during
# registration are immediately visible to each node container.
#
# Node containers start only after the coordinator healthcheck passes,
# ensuring KEM keys and share-store files are already created on the
# shared volume before nodes try to read them.

services:
  coordinator:
    build: .
    environment:
      NODE_TRANSPORT: "http"
      NODE_PEERS: "node1:8001,node2:8002,node3:8003,node4:8004,node5:8005"
      DATA_DIR: "/app/data"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ${HOME}/.decidp:/root/.decidp
    networks: [decidp]
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          python -c
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  node1:
    build: .
    environment:
      NODE_ID: "1"
      DATA_DIR: "/app/data"
    ports: ["8001:8001"]
    volumes:
      - ./data:/app/data
    networks: [decidp]
    command: uvicorn api.node_service:app --host 0.0.0.0 --port 8001
    depends_on:
      coordinator:
        condition: service_healthy

  node2:
    build: .
    environment:
      NODE_ID: "2"
      DATA_DIR: "/app/data"
    ports: ["8002:8002"]
    volumes:
      - ./data:/app/data
    networks: [decidp]
    command: uvicorn api.node_service:app --host 0.0.0.0 --port 8002
    depends_on:
      coordinator:
        condition: service_healthy

  node3:
    build: .
    environment:
      NODE_ID: "3"
      DATA_DIR: "/app/data"
    ports: ["8003:8003"]
    volumes:
      - ./data:/app/data
    networks: [decidp]
    command: uvicorn api.node_service:app --host 0.0.0.0 --port 8003
    depends_on:
      coordinator:
        condition: service_healthy

  node4:
    build: .
    environment:
      NODE_ID: "4"
      DATA_DIR: "/app/data"
    ports: ["8004:8004"]
    volumes:
      - ./data:/app/data
    networks: [decidp]
    command: uvicorn api.node_service:app --host 0.0.0.0 --port 8004
    depends_on:
      coordinator:
        condition: service_healthy

  node5:
    build: .
    environment:
      NODE_ID: "5"
      DATA_DIR: "/app/data"
    ports: ["8005:8005"]
    volumes:
      - ./data:/app/data
    networks: [decidp]
    command: uvicorn api.node_service:app --host 0.0.0.0 --port 8005
    depends_on:
      coordinator:
        condition: service_healthy

networks:
  decidp:
    driver: bridge
